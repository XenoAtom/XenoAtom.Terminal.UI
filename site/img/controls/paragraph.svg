<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 594" width="918" height="594" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="594" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="603" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Paragraph is display-only text with style runs and hyperlink spans.</text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="90" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Alignment:</text><text class="t" x="99" y="72" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" xml:space="preserve">  Left </text><text class="t" x="162" y="72" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">▾</text><text class="t" x="9" y="108" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">┌──────────────────────────────────────────────────────────────────────────────────────────────────┐</text><text class="t" x="9" y="126" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="126" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="144" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="144" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve"> Paragraph wraps plain text with rich paragraph layout. Resize the terminal to observe hanging    </text><text class="t" x="900" y="144" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="162" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="162" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve"> indentation and alignment.                                                                       </text><text class="t" x="900" y="162" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="180" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="180" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="198" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="198" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="216" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">└──────────────────────────────────────────────────────────────────────────────────────────────────┘</text><text class="t" x="9" y="252" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">┌──────────────────────────────────────────────────────────────────────────────────────────────────┐</text><text class="t" x="9" y="270" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="270" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="288" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="288" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve">  • A bullet paragraph keeps wrapped continuation lines aligned under the text content for        </text><text class="t" x="900" y="288" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="306" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="306" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve">      readable list rendering.                                                                    </text><text class="t" x="900" y="306" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="324" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="324" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="342" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="342" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="360" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="360" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve">  │ Quoted text can use line prefixes and continuation prefixes to mimic blockquote rendering in  </text><text class="t" x="900" y="360" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="378" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="378" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve">  │ a Markdown-like flow.                                                                         </text><text class="t" x="900" y="378" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="396" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="396" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" xml:space="preserve">  │                                                                                               </text><text class="t" x="900" y="396" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="414" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="900" y="414" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="432" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">└──────────────────────────────────────────────────────────────────────────────────────────────────┘</text><text class="t" x="9" y="468" fill="rgb(189,189,191)" textLength="441" lengthAdjust="spacing" xml:space="preserve">┌───────────────────────────────────────────────┐</text><text class="t" x="9" y="486" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="441" y="486" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="504" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="27" y="504" fill="rgb(218,165,32)" textLength="45" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Visit</text><text class="t" x="81" y="504" fill="rgb(0,191,255)" textLength="162" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">xenoatom.github.io</text><text class="t" x="243" y="504" fill="rgb(205,213,235)" textLength="45" lengthAdjust="spacing" xml:space="preserve"> for </text><text class="t" x="288" y="504" fill="rgb(192,192,192)" textLength="36" lengthA