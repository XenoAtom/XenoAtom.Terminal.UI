<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 360" width="918" height="360" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="360" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="432" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Group supports corner labels and a content area.</text><text class="t" x="9" y="72" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">┌</text><text class="t" x="27" y="72" fill="rgb(189,189,191)" textLength="63" lengthAdjust="spacing" font-weight="700" xml:space="preserve">TopLeft</text><text class="t" x="99" y="72" fill="rgb(189,189,191)" textLength="54" lengthAdjust="spacing" xml:space="preserve">──────</text><text class="t" x="162" y="72" fill="rgb(189,189,191)" textLength="72" lengthAdjust="spacing" font-weight="700" xml:space="preserve">TopRight</text><text class="t" x="243" y="72" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">┐</text><text class="t" x="9" y="90" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="243" y="90" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="108" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="108" fill="rgb(205,213,235)" textLength="225" lengthAdjust="spacing" xml:space="preserve"> Inside a group          </text><text class="t" x="243" y="108" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="126" fill="rgb(