<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 450" width="918" height="450" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="450" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="468" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Bind TextBox.Text to State&lt;string&gt; for live updates.</text><rect x="18" y="54" width="45" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="54" fill="rgb(205,213,235)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Hello</text><rect x="63" y="54" width="837" height="18" fill="rgb(30,36,56)"/><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Value: Hello                                                                                        </text><text class="t" x="9" y="126" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="9" y="162" fill="rgb(205,213,235)" textLength="162" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Password (TextBox)</text><rect x="18" y="198" width="63" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="198" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" xml:space="preserve">•••••••</text><rect x="81" y="198" width="819" height="18" fill="rgb(30,36,56)"/><text class="t" x="9" y="234" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☐</text><text class="t" x="18" y="234" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">  Reveal while focused                                                                             </text><text class="t" x="9" y="270" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="9" y="306" fill="rgb(205,213,235)" textLength="99" lengthAdjust="spacing" font-weight="700" xml:space="preserve">With Border</text><text class="t" x="9" y="342" fill="rgb(189,189,191)" textLength="234" lengthAdjust="spacing" xml:space="preserve">┌────────────────────────┐</text><text class="t" x="9" y="360" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><rect x="27" y="360" width="72" height="18" fill="rgb(34,40,58)"/><text class="t" x="27" y="360" fill="rgb(205,213,235)" textLength="72" lengthAdjust="spacing" xml:space="preserve">Bordered</text><rect x="99" y="360" width="126" height="18" fill="rgb(30,36,56)"/><text class="t" x="234" y="360" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="378" fill="rgb(189,189,191)" textLength="234" lengthAdjust="spacing" xml:space="preserve">└────────────────────────┘</text><rect x="9" y="414" width="18" height="18" fill="rgb(74,76,86)"/><rect x="27" y="414" width="81" height="18" fill="rgb(74,76,86)"/><text class="t" x="27" y="414" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Log value</text><rect x="108" y="414" width="18" height="18" fill="rgb(74,76,86)"/></svg>