<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 756" width="918" height="756" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="756" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="882" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Loaded markdown from disk: markdown-control-sample.md. The sample exercises CommonMark plus tables</text><text class="t" x="9" y="36" fill="rgb(205,213,235)" textLength="189" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">and alert extensions.</text><text class="t" x="9" y="72" fill="rgb(182,149,46)" textLength="261" lengthAdjust="spacing" font-weight="700" text-decoration="underline" xml:space="preserve">MarkdownControl Demo Document</text><text class="t" x="900" y="72" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="900" y="90" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">This document is intentionally long and feature-dense so the demo can validate CommonMark          </text><text class="t" x="900" y="108" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">rendering plus selected extensions. It starts with a quick tour so the first viewport shows mixed  </text><text class="t" x="900" y="126" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="9" y="144" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">content instead of heading-only blocks.                                                            </text><text class="t" x="900" y="144" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="900" y="162" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="9" y="180" fill="rgb(182,149,46)" textLength="189" lengthAdjust="spacing" font-weight="700" xml:space="preserve">1. Quick Feature Tour</text><text class="t" x="900" y="180" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="900" y="198" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="216" fill="rgb(205,213,235)" textLength="216" lengthAdjust="spacing" xml:space="preserve">This paragraph includes </text><text class="t" x="225" y="216" fill="rgb(205,213,235)" textLength="72" lengthAdjust="spacing" font-style="italic" xml:space="preserve">emphasis</text><text class="t" x="297" y="216" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="315" y="216" fill="rgb(94,122,229)" textLength="135" lengthAdjust="spacing" font-weight="700" xml:space="preserve">strong emphasis</text><text class="t" x="450" y="216" fill="rgb(205,213,235)" textLength="54" lengthAdjust="spacing" xml:space="preserve">, and </text><text class="t" x="504" y="216" fill="rgb(94,122,229)" textLength="153" lengthAdjust="spacing" font-weight="700" font-style="italic" xml:space="preserve">combined emphasis</text><text class="t" x="657" y="216" fill="rgb(205,213,235)" textLength="243" lengthAdjust="spacing" xml:space="preserve"> in one sentence. Inline   </text><text class="t" x="900" y="216" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="234" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">code appears as </text><rect x="153" y="234" width="234" height="18" fill="rgb(32,38,60)"/><text class="t" x="153" y="234" fill="rgb(233,110,93)" textLength="234" lengthAdjust="spacing" xml:space="preserve">Console.WriteLine(&quot;Hello&quot;)</text><text class="t" x="387" y="234" fill="rgb(205,213,235)" textLength="189" lengthAdjust="spacing" xml:space="preserve"> and links appear as </text><text class="t" x="576" y="234" fill="rgb(94,122,229)" textLength="162" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">project repository</text><text class="t" x="738" y="234" fill="rgb(205,213,235)" textLength="162" lengthAdjust="spacing" xml:space="preserve">.                 </text><text class="t" x="900" y="234" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="252" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="270" fill="rgb(205,213,235)" textLength="360" lengthAdjust="spacing" xml:space="preserve">Reference style links are also covered: </text><text class="t" x="369" y="270" fill="rgb(94,122,229)" textLength="144" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">Terminal UI Docs</text><text class="t" x="513" y="270" fill="rgb(205,213,235)" textLength="45" lengthAdjust="spacing" xml:space="preserve"> and </text><text class="t" x="558" y="270" fill="rgb(94,122,229)" textLength="126" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">Markdown Guide</text><text class="t" x="684" y="270" fill="rgb(205,213,235)" textLength="216" lengthAdjust="spacing" xml:space="preserve">. Automatic URL support </text><text class="t" x="900" y="270" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="288" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">should remain readable: .                                                                          </text><text class="t" x="900" y="288" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="306" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="324" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">Escaped characters: *not italic*, _not emphasis_, and a literal bracket [value]. Entity support:   </text><text class="t" x="900" y="324" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="342" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">ampersand is  and angle brackets are tag.                                                          </text><text class="t" x="900" y="342" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="360" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="378" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">Hard line break with two trailing spaces.                                                          </text><text class="t" x="900" y="378" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="396" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">This line should start immediately below.                                                          </text><text class="t" x="900" y="396" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="414" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="432" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">Soft line break continues as a normal space in the same paragraph.                                 </text><text class="t" x="900" y="432" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="450" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="468" fill="rgb(205,213,235)" textLength="198" lengthAdjust="spacing" xml:space="preserve">│ A simple quote with </text><text class="t" x="207" y="468" fill="rgb(94,122,229)" textLength="99" lengthAdjust="spacing" font-weight="700" xml:space="preserve">strong text</text><text class="t" x="306" y="468" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" xml:space="preserve"> and a </text><text class="t" x="369" y="468" fill="rgb(94,122,229)" textLength="99" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">quoted link</text><text class="t" x="468" y="468" fill="rgb(205,213,235)" textLength="432" lengthAdjust="spacing" xml:space="preserve">.                                               </text><text class="t" x="900" y="468" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="486" fill="rgb(205,213,235)" textLength="198" lengthAdjust="spacing" xml:space="preserve">│ │ Nested quote with </text><rect x="207" y="486" width="99" height="18" fill="rgb(32,38,60)"/><text class="t" x="207" y="486" fill="rgb(233,110,93)" textLength="99" lengthAdjust="spacing" xml:space="preserve">inline code</text><text class="t" x="306" y="486" fill="rgb(205,213,235)" textLength="594" lengthAdjust="spacing" xml:space="preserve">.                                                                 </text><text class="t" x="900" y="486" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="504" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="522" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">• Unordered item one                                                                               </text><text class="t" x="900" y="522" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="540" fill="rgb(205,213,235)" textLength="234" lengthAdjust="spacing" xml:space="preserve">• Unordered item two with </text><rect x="243" y="540" width="36" height="18" fill="rgb(32,38,60)"/><text class="t" x="243" y="540" fill="rgb(233,110,93)" textLength="36" lengthAdjust="spacing" xml:space="preserve">code</text><text class="t" x="900" y="540" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="558" fill="rgb(205,213,235)" textLength="270" lengthAdjust="spacing" xml:space="preserve">• Unordered item three with a </text><text class="t" x="279" y="558" fill="rgb(94,122,229)" textLength="99" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">nested link</text><text class="t" x="900" y="558" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="576" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="594" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">1. Ordered item one                                                                                </text><text class="t" x="900" y="594" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="612" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">2. Ordered item two                                                                                </text><text class="t" x="900" y="612" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="630" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">3. Ordered item three                                                                              </text><text class="t" x="900" y="630" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="648" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="666" fill="rgb(189,189,191)" textLength="891" lengthAdjust="spacing" xml:space="preserve">───────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="900" y="666" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="684" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="9" y="702" fill="rgb(182,149,46)" textLength="171" lengthAdjust="spacing" font-weight="700" xml:space="preserve">2. Tables Extension</text><text class="t" x="900" y="702" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="900" y="720" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text></svg>