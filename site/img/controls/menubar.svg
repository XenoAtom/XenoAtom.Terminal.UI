<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 306" width="918" height="306" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="306" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" font-weight="700" xml:space="preserve">MenuBar</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Use Tab to focus the menu bar, then Enter/Down to open. Navigate nested menus with Right/Left       </text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">arrows and activate with Enter.                                                                     </text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☑</text><text class="t" x="18" y="108" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">  Open enabled                                                                                     </text><rect x="9" y="144" width="900" height="18" fill="rgb(74,76,86)"/><text class="t" x="9" y="144" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">   File    Help                                                                                     </text><text class="t" x="9" y="180" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Status: ready                                                                                       </text><rect x="18" y="216" width="612" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="216" fill="rgb(205,213,235)" textLength="612" lengthAdjust="spacing" xml:space="preserve">This is a focusable control. Try focusing it, then opening the menu.</text><rect x="630" y="216" width="270" height="18" fill="rgb(30,36,56)"/><rect x="18" y="234" width="882" height="18" fill="rgb(30,36,56)"/><rect x="18" y="252" width="882" height="18" fill="rgb(30,36,56)"/><rect x="18" y="270" width="882" height="18" fill="rgb(30,36,56)"/></svg>