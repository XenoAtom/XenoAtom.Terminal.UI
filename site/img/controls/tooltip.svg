<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 306" width="846" height="306" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="846" height="306" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="828" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Tooltips appear when hovering in fullscreen apps. They are implemented via the window layer.</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" textLength="675" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Click a button, then move to the other one to verify tooltips do not stick.</text><text class="t" x="9" y="90" fill="rgb(94,122,229)" textLength="486" lengthAdjust="spacing" xml:space="preserve">┌────────────────────────────────────────────────────┐</text><text class="t" x="9" y="108" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="486" y="108" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="126" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="486" y="126" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="144" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="486" y="144" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="162" fill="rgb(94,122,229)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><rect x="117" y="162" width="18" height="18" fill="rgb(74,76,8