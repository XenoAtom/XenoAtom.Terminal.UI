<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 639 414" width="639" height="414" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="639" height="414" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="621" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">OptionList supports a selected index, disabled items, and activation.</text><text class="t" x="9" y="72" fill="rgb(94,122,229)" textLength="18" lengthAdjust="spacing" font-weight="700" xml:space="preserve">→ </text><text class="t" x="27" y="72" fill="rgb(94,122,229)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Open</text><text class="t" x="90" y="72" fill="rgb(94,122,229)" textLength="54" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Ctrl+O</text><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="630" lengthAdjust="spacing" xml:space="preserve">  Save   Ctrl+S                                                       </text><text class="t" x="27" y="108" fill="rgb(151,158,176)" textLength="117" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Disabled item</text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="630" lengthAdjust="spacing" xml:space="preserve">  Quit      Esc                                                       </text><text class="t" x="9" y="162" fill="rgb(205,213,235)" textLength="630" lengthAdjust="spacing" xml:space="preserve">SelectedIndex: 0                                                      </text><text class="t" x="9" y="198" fill="rgb(205,213,235)" textLength="459" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">With many items, wrap OptionList in a ScrollViewer.</text><text class="t" x="9" y="252" fill="rgb(189,189,191)" textLength="171" lengthAdjust="spacing" xml:space="preserve">┌─────────────────┐</text><text class="t" x="9" y="270" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="270" fill="rgb(94,122,229)" textLength="18" lengthAdjust="spacing" font-weight="700" xml:space="preserve">→ </text><text class="t" x="36" y="270" fill="rgb(94,122,229)" textLength="63" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Item 00</text><text class="t" x="117" y="270" fill="rgb(94,122,229)" textLength="45" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Enter</text><text class="t" x="162" y="270" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">█</text><text class="t" x="171" y="270" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="288" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="288" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Item 01  Enter</text><text class="t" x="162" y="288" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="171" y="288" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="306" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="306" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Item 02  Enter</text><text class="t" x="162" y="306" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="171" y="306" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="324" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="324" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Item 03  Enter</text><text class="t" x="162" y="324" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="171" y="324" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="342" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="342" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Item 04  Enter</text><text class="t" x="162" y="342" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="171" y="342" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="360" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="18" y="360" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Item 05  Enter</text><text class="t" x="162" y="360" fill="rgb(183,190,211)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">░</text><text class="t" x="171" y="360" fill="rgb(189,189,191)" textLength="9" lengthAdjust="spacing" xml:space="preserve">│</text><text class="t" x="9" y="378" fill="rgb(189,189,191)" textLength="171" lengthAdjust="spacing" xml:space="preserve">└─────────────────┘</text></svg>