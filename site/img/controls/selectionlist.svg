<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 468" width="504" height="468" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="504" height="468" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="486" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Use Space/Enter to toggle an item. Use arrows to move.</text><text class="t" x="9" y="72" fill="rgb(189,189,191)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">→☐  </text><text class="t" x="45" y="72" fill="rgb(189,189,191)" textLength="45" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Alpha</text><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="495" lengthAdjust="spacing" xml:space="preserve"> ☐  Beta                                               </text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="495" lengthAdjust="spacing" xml:space="preserve"> ☐  Gamma                                              </text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="495" lengthAdjust="spacing" xml:space="preserve"> ☐  Delta                                              </text><text class="t" x="9" y="144" fill="rgb(205,213,235)" textLength="495" lengthAdjust="spacing" xml:space="preserve"> ☐  Epsilon                                            </text><text class="t" x="9" y="180" fill="rgb(205,213,235)" textLength="495" lengthAdjust="spacing" xml:space="preserve">Checked: 0                                             </text><text class="t" x="9" y="216" fill="rgb(205,213,235)" textLength="486" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">With many items, wrap Selection