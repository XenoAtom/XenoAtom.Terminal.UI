<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 162" width="729" height="162" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="729" height="162" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="450" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Markup supports styling tags and hard line breaks.</text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☑</text><text class="t" x="18" y="72" fill="rgb(205,213,235)" textLength="711" lengthAdjust="spacing" xml:space="preserve">  Wrap                                                                         </text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Bold</text><text class="t" x="45" y="108" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="63" y="108" fill="rgb(205,213,235)" textLength="27" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">dim</text><text class="t" x="90" y="108" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="108" y="108" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">underline</text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="720" lengthAdjust="spacing" xml:space="preserve">This is a long line that can be wrapped to demonstrate text wrapping in Markup. </text></svg>