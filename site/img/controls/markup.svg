" y="162" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><rect x="234" y="162" width="135" height="18" fill="rgb(20,80,60)"/><text class="t" x="234" y="162" fill="rgb(232,248,240)" textLength="135" lengthAdjust="spacing" xml:space="preserve">bg:rgb + fg hex</text><text class="t" x="9" y="180" fill="rgb(205,213,235)" textLength="135" lengthAdjust="spacing" xml:space="preserve">Nested styles: </text><text class="t" x="144" y="180" fill="rgb(94,122,229)" textLength="126" lengthAdjust="spacing" font-weight="700" xml:space="preserve">bold + primary</text><text class="t" x="270" y="180" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><rect x="288" y="180" width="126" height="18" fill="rgb(26,26,26)"/><text class="t" x="288" y="180" fill="rgb(205,213,235)" textLength="126" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">underline + bg</text><text class="t" x="9" y="198" fill="rgb(205,213,235)" textLength="720" lengthAdjust="spacing" xml:space="preserve">This is a long line that can be wrapped to demonstrate text wrapping in Markup. </text></svg>