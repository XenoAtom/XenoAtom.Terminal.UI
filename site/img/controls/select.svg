<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 378" width="918" height="378" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="378" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="567" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Select opens a popup; click outside, press Tab or Esc to close.</text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" xml:space="preserve"> First </text><text class="t" x="72" y="72" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">▾</text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">SelectedIndex: 0                                                                                    </text><rect x="9" y="144" width="18" height="18" fill="rgb(74,76,86)"/><rect x="27" y="144" width="117" height="18" fill="rgb(74,76,86)"/><text class="t" x="27" y="144" fill="rgb(205,213,235)" textLength="117" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Log selection</text><rect x="144" y="144" width="18" height="18" fill="rgb(74,76,86)"/><text class="t" x="9" y="180" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="9" y="216" fill="rgb(205,213,235)" textLength="153" lengthAdjust="spacing" font-weight="700" xml:space="preserve">EnumSelect&lt;TEnum&gt;</text><text class="t" x="9" y="252" fill="rgb(205,213,235)" textLength="792" lengthAdjust="spacing" opaci