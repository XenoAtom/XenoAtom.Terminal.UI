<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 162" width="522" height="162" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="522" height="162" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="504" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">A checkbox can be bound to State&lt;bool&gt; for live updates.</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☐</text><text class="t" x="18" y="54" fill="rgb(205,213,235)" textLength="504" lengthAdjust="spacing" xml:space="preserve">  Accept terms                                          </text><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="513" lengthAdjust="spacing" xml:space="preserve">State: unchecked                                         </text><rect x="9" y="126" width="18" height="18" fill="rgb(74,76,86)"/><rect x="27" y="126" width="81" height="18" fill="rgb(74,76,86)"/><text class="t" x="27" y="126" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Log state</text><rect x="108" y="126" width="18" height="18" fill="rgb(74,76,86)"/></svg>