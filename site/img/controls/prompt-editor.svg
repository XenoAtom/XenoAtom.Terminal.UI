<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 468" width="918" height="468" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="468" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(0,205,0)" textLength="108" lengthAdjust="spacing" font-weight="700" xml:space="preserve">PromptEditor</text><text class="t" x="117" y="18" fill="rgb(205,213,235)" textLength="792" lengthAdjust="spacing" xml:space="preserve"> — prompt-style editor demo                                                             </text><text class="t" x="9" y="54" fill="rgb(127,127,127)" textLength="36" lengthAdjust="spacing" xml:space="preserve">Try:</text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="72" lengthAdjust="spacing" xml:space="preserve"> • Type </text><text class="t" x="81" y="72" fill="rgb(205,0,0)" textLength="45" lengthAdjust="spacing" font-weight="700" xml:space="preserve">error</text><text class="t" x="126" y="72" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="144" y="72" fill="rgb(205,205,0)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">warn</text><text class="t" x="180" y="72" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="198" y="72" fill="rgb(0,205,0)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">info</text><text class="t" x="234" y="72" fill="rgb(205,213,235)" textLength="675" lengthAdjust="spacing" xml:space="preserve"> to see syntax highlighting.                                               </text><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" xml:space="preserve"> • The </text><text class="t" x="72" y="90" fill="rgb(205,213,235)" textLength="108" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">current word</text><text class="t" x="180" y="90" fill="rgb(205,213,235)" textLength="729" lengthAdjust="spacing" xml:space="preserve"> is underlined (caret-aware highlight).                                          </text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="72" lengthAdjust="spacing" xml:space="preserve"> • Type </text><text class="t" x="81" y="108" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">/</text><text class="t" x="90" y="108" fill="rgb(205,213,235)" textLength="108" lengthAdjust="spacing" xml:space="preserve"> then press </text><text class="t" x="198" y="108" fill="rgb(0,205,205)" textLength="27" lengthAdjust="spacing" xml:space="preserve">Tab</text><text class="t" x="225" y="108" fill="rgb(205,213,235)" textLength="243" lengthAdjust="spacing" xml:space="preserve"> to complete commands like </text><text class="t" x="468" y="108" fill="rgb(205,213,235)" textLength="45" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">/help</text><text class="t" x="513" y="108" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="531" y="108" fill="rgb(205,213,235)" textLength="54" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">/clear</text><text class="t" x="585" y="108" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="603" y="108" fill="rgb(205,213,235)" textLength="45" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">/exit</text><text class="t" x="648" y="108" fill="rgb(205,213,235)" textLength="261" lengthAdjust="spacing" xml:space="preserve">.                            </text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" xml:space="preserve"> • Press </text><text class="t" x="90" y="126" fill="rgb(0,205,205)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Alt+↑</text><text class="t" x="135" y="126" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" xml:space="preserve">/</text><text class="t" x="144" y="126" fill="rgb(0,205,205)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Alt+↓</text><text class="t" x="189" y="126" fill="rgb(205,213,235)" textLength="720" lengthAdjust="spacing" xml:space="preserve"> to navigate history.                                                           </text><text class="t" x="9" y="144" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" xml:space="preserve"> • Press </text><text class="t" x="90" y="144" fill="rgb(0,205,205)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Enter</text><text class="t" x="135" y="144" fill="rgb(205,213,235)" textLength="108" lengthAdjust="spacing" xml:space="preserve"> to accept; </text><text class="t" x="243" y="144" fill="rgb(0,205,205)" textLength="54" lengthAdjust="spacing" xml:space="preserve">Ctrl+J</text><text class="t" x="297" y="144" fill="rgb(205,213,235)" textLength="180" lengthAdjust="spacing" xml:space="preserve"> inserts a newline; </text><text class="t" x="477" y="144" fill="rgb(0,205,205)" textLength="27" lengthAdjust="spacing" xml:space="preserve">Esc</text><text class="t" x="504" y="144" fill="rgb(205,213,235)" textLength="405" lengthAdjust="spacing" xml:space="preserve"> cancels completion/prompt.                  </text><rect x="18" y="180" width="18" height="18" fill="rgb(34,42,71)"/><text class="t" x="18" y="180" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">&gt; </text><rect x="36" y="180" width="504" height="18" fill="rgb(34,40,58)"/><text class="t" x="36" y="180" fill="rgb(183,191,211)" textLength="504" lengthAdjust="spacing" xml:space="preserve">Type a command. Tab completes. Ctrl+J inserts a newline.</text><rect x="540" y="180" width="360" height="18" fill="rgb(30,36,56)"/><rect x="18" y="198" width="9" height="18" fill="rgb(34,42,71)"/><text class="t" x="18" y="198" fill="rgb(183,191,212)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">.</text><rect x="27" y="198" width="9" height="18" fill="rgb(34,42,71)"/><rect x="36" y="198" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="216" width="9" height="18" fill="rgb(34,42,71)"/><text class="t" x="18" y="216" fill="rgb(183,191,212)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">.</text><rect x="27" y="216" width="9" height="18" fill="rgb(34,42,71)"/><rect x="36" y="216" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="234" width="9" height="18" fill="rgb(34,42,71)"/><text class="t" x="18" y="234" fill="rgb(183,191,212)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">.</text><rect x="27" y="234" width="9" height="18" fill="rgb(34,42,71)"/><rect x="36" y="234" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="252" width="9" height="18" fill="rgb(34,42,71)"/><text class="t" x="18" y="252" fill="rgb(183,191,212)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">.</text><rect x="27" y="252" width="9" height="18" fill="rgb(34,42,71)"/><rect x="36" y="252" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="270" width="9" height="18" fill="rgb(34,42,71)"/><text class="t" x="18" y="270" fill="rgb(183,191,212)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">.</text><rect x="27" y="270" width="9" height="18" fill="rgb(34,42,71)"/><rect x="36" y="270" width="864" height="18" fill="rgb(30,36,56)"/><text class="t" x="9" y="324" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☐</text><text class="t" x="18" y="324" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Visual Gutter </text><text class="t" x="162" y="324" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☐</text><text class="t" x="171" y="324" fill="rgb(205,213,235)" textLength="189" lengthAdjust="spacing" xml:space="preserve">  Auto Prompt Promp  </text><rect x="360" y="324" width="9" height="18" fill="rgb(34,40,58)"/><text class="t" x="360" y="324" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" xml:space="preserve">&gt;</text><rect x="369" y="324" width="189" height="18" fill="rgb(30,36,56)"/><text class="t" x="558" y="324" fill="rgb(205,213,235)" textLength="144" lengthAdjust="spacing" xml:space="preserve">  Continuation  </text><rect x="702" y="324" width="81" height="18" fill="rgb(34,40,58)"/><text class="t" x="702" y="324" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" xml:space="preserve">[dim].[/]</text><rect x="783" y="324" width="117" height="18" fill="rgb(30,36,56)"/><text class="t" x="9" y="360" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Last accepted: (none)                                                                               </text><text class="t" x="9" y="396" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><rect x="9" y="432" width="900" height="18" fill="rgb(57,60,73)"/></svg>