<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 414" width="918" height="414" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="414" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(0,0,0)" textLength="108" lengthAdjust="spacing" font-weight="700" xml:space="preserve">PromptEditor</text><text class="t" x="117" y="18" fill="rgb(205,213,235)" textLength="792" lengthAdjust="spacing" xml:space="preserve"> — prompt-style editor demo                                                             </text><text class="t" x="9" y="54" fill="rgb(0,0,0)" textLength="36" lengthAdjust="spacing" xml:space="preserve">Try:</text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="72" lengthAdjust="spacing" xml:space="preserve"> • Type </text><text class="t" x="81" y="72" fill="rgb(0,0,0)" textLength="45" lengthAdjust="spacing" font-weight="700" xml:space="preserve">error</text><text class="t" x="126" y="72" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="144" y="72" fill="rgb(0,0,0)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">warn</text><text class="t" x="180" y="72" fill="rgb(205,213,235)" textLength="18" lengthAdjust="spacing" xml:space="preserve">, </text><text class="t" x="198" y="72" fill="rgb(0,0,0)" textLength="36" lengthAdjust="spacing" font-weight="700" xml:space="preserve">info</text><text class="t" x="234" y="72" fill="rgb(205,213,235)" textLength="675" lengthAdjust="spacing" xml:space="preserve"> to see syntax highlighting.                                               </text><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="63" lengthAdjust="spacing" xml:space="preserve"> • The </text><text class="t" x="72" y="90" fill="rgb(205,213,235)" textLength="108" lengthAdjust="spacing" text-decoration="underline" xml:space="preserve">current word</text><text class="t" x="180" y="90" fill="rgb(205,213,235)" textLength="729" lengthAdjust="spacing" xml:space="preserve"> is underlined (caret-aware highlight).                                          </text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" xml:space="preserve"> • Press </text><text class="t" x="90" y="108" fill="rgb(0,0,0)" textLength="27" lengthAdjust="spacing" xml:space="preserve">Tab</text><text class="t" x="117" y="108" fill="rgb(205,213,235)" textLength="792" lengthAdjust="spacing" xml:space="preserve"> to request completion (popup list) for commands like help, clear, exit.                </text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" xml:space="preserve"> • Press </text><text class="t" x="90" y="126" fill="rgb(0,0,0)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Alt+↑</text><text class="t" x="135" y="126" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" xml:space="preserve">/</text><text class="t" x="144" y="126" fill="rgb(0,0,0)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Alt+↓</text><text class="t" x="189" y="126" fill="rgb(205,213,235)" textLength="720" lengthAdjust="spacing" xml:space="preserve"> to navigate history.                                                           </text><text class="t" x="9" y="144" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" xml:space="preserve"> • Press </text><text class="t" x="90" y="144" fill="rgb(0,0,0)" textLength="45" lengthAdjust="spacing" xml:space="preserve">Enter</text><text class="t" x="135" y="144" fill="rgb(205,213,235)" textLength="108" lengthAdjust="spacing" xml:space="preserve"> to accept; </text><text class="t" x="243" y="144" fill="rgb(0,0,0)" textLength="54" lengthAdjust="spacing" xml:space="preserve">Ctrl+J</text><text class="t" x="297" y="144" fill="rgb(205,213,235)" textLength="180" lengthAdjust="spacing" xml:space="preserve"> inserts a newline; </text><text class="t" x="477" y="144" fill="rgb(0,0,0)" textLength="27" lengthAdjust="spacing" xml:space="preserve">Esc</text><text class="t" x="504" y="144" fill="rgb(205,213,235)" textLength="405" lengthAdjust="spacing" xml:space="preserve"> cancels completion/prompt.                  </text><rect x="18" y="180" width="27" height="18" fill="rgb(30,36,56)"/><text class="t" x="18" y="180" fill="rgb(0,0,0)" textLength="27" lengthAdjust="spacing" xml:space="preserve">  1</text><rect x="45" y="180" width="9" height="18" fill="rgb(30,36,56)"/><rect x="54" y="180" width="36" height="18" fill="rgb(30,36,56)"/><text class="t" x="54" y="180" fill="rgb(94,122,229)" textLength="36" lengthAdjust="spacing" xml:space="preserve">demo</text><rect x="90" y="180" width="27" height="18" fill="rgb(30,36,56)"/><text class="t" x="90" y="180" fill="rgb(205,213,235)" textLength="27" lengthAdjust="spacing" xml:space="preserve"> &gt; </text><rect x="117" y="180" width="504" height="18" fill="rgb(34,40,58)"/><text class="t" x="117" y="180" fill="rgb(183,191,211)" textLength="504" lengthAdjust="spacing" xml:space="preserve">Type a command. Tab completes. Ctrl+J inserts a newline.</text><rect x="621" y="180" width="279" height="18" fill="rgb(30,36,56)"/><rect x="18" y="198" width="9" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="198" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">·</text><rect x="27" y="198" width="9" height="18" fill="rgb(34,40,58)"/><rect x="36" y="198" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="216" width="9" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="216" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">·</text><rect x="27" y="216" width="9" height="18" fill="rgb(34,40,58)"/><rect x="36" y="216" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="234" width="9" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="234" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">·</text><rect x="27" y="234" width="9" height="18" fill="rgb(34,40,58)"/><rect x="36" y="234" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="252" width="9" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="252" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">·</text><rect x="27" y="252" width="9" height="18" fill="rgb(34,40,58)"/><rect x="36" y="252" width="864" height="18" fill="rgb(30,36,56)"/><rect x="18" y="270" width="9" height="18" fill="rgb(34,40,58)"/><text class="t" x="18" y="270" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">·</text><rect x="27" y="270" width="9" height="18" fill="rgb(34,40,58)"/><rect x="36" y="270" width="864" height="18" fill="rgb(30,36,56)"/><text class="t" x="9" y="306" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Last accepted: (none)                                                                               </text><text class="t" x="9" y="342" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><rect x="9" y="378" width="900" height="18" fill="rgb(57,60,73)"/></svg>