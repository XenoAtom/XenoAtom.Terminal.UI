<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 270" width="918" height="270" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="270" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="855" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">CommandBar surfaces commands registered on the focused visual (and its parents), plus app-level</text><text class="t" x="9" y="36" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">commands.</text><rect x="18" y="90" width="882" height="18" fill="rgb(23,29,49)"/><rect x="9" y="126" width="18" height="18" fill="rgb(74,76,86)"/><rect x="27" y="126" width="81" height="18" fill="rgb(74,76,86)"/><text class="t" x="27" y="126" fill="rgb(205,213,235)" textLength="81" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Increment</text><rect x="108" y="126" width="18" height="18" fill="rgb(74,76,86)"/><text class="t" x="144" y="126" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☑</text><text class="t" x="153" y="126" fill="rgb(205,213,235)" textLength="756" lengthAdjust="spacing" xml:space="preserve">  Enabled                                                                           </text><text class="t" x="9" y="162" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Counter: 0                                                                                          </text><text class="t" x="9" y="198" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><rect x="9" y="234" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="9" y="234" fill="rgb(94,122,229)" textLength="72" lengthAdjust="spacing" font-weight="700" xml:space="preserve">[Ctrl+Z]</text><rect x="81" y="234" width="9" height="18" fill="rgb(57,60,73)"/><rect x="90" y="234" width="36" height="18" fill="rgb(57,60,73)"/><text class="t" x="90" y="234" fill="rgb(155,161,179)" textLength="36" lengthAdjust="spacing" xml:space="preserve">Undo</text><rect x="126" y="234" width="27" height="18" fill="rgb(57,60,73)"/><text class="t" x="126" y="234" fill="rgb(205,213,235)" textLength="27" lengthAdjust="spacing" xml:space="preserve"> | </text><rect x="153" y="234" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="153" y="234" fill="rgb(94,122,229)" textLength="72" lengthAdjust="spacing" font-weight="700" xml:space="preserve">[Ctrl+R]</text><rect x="225" y="234" width="9" height="18" fill="rgb(57,60,73)"/><rect x="234" y="234" width="36" height="18" fill="rgb(57,60,73)"/><text class="t" x="234" y="234" fill="rgb(155,161,179)" textLength="36" lengthAdjust="spacing" xml:space="preserve">Redo</text><rect x="270" y="234" width="27" height="18" fill="rgb(57,60,73)"/><text class="t" x="270" y="234" fill="rgb(205,213,235)" textLength="27" lengthAdjust="spacing" xml:space="preserve"> | </text><rect x="297" y="234" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="297" y="234" fill="rgb(94,122,229)" textLength="72" lengthAdjust="spacing" font-weight="700" xml:space="preserve">[Ctrl+E]</text><rect x="369" y="234" width="162" height="18" fill="rgb(57,60,73)"/><text class="t" x="369" y="234" fill="rgb(205,213,235)" textLength="162" lengthAdjust="spacing" xml:space="preserve"> Toggle enabled | </text><rect x="531" y="234" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="531" y="234" fill="rgb(94,122,229)" textLength="72" lengthAdjust="spacing" font-weight="700" xml:space="preserve">[Ctrl+R]</text><rect x="603" y="234" width="9" height="18" fill="rgb(57,60,73)"/><rect x="612" y="234" width="117" height="18" fill="rgb(57,60,73)"/><text class="t" x="612" y="234" fill="rgb(155,161,179)" textLength="117" lengthAdjust="spacing" xml:space="preserve">Reset counter</text><rect x="729" y="234" width="27" height="18" fill="rgb(57,60,73)"/><text class="t" x="729" y="234" fill="rgb(205,213,235)" textLength="27" lengthAdjust="spacing" xml:space="preserve"> | </text><rect x="756" y="234" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="756" y="234" fill="rgb(94,122,229)" textLength="72" lengthAdjust="spacing" font-weight="700" xml:space="preserve">[Ctrl+Q]</text><rect x="828" y="234" width="45" height="18" fill="rgb(57,60,73)"/><text class="t" x="828" y="234" fill="rgb(205,213,235)" textLength="45" lengthAdjust="spacing" xml:space="preserve"> Quit</text></svg>