<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 324" width="918" height="324" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="324" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="666" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">VStack stacks children vertically. Spacing controls the gap between items.</text><text class="t" x="9" y="72" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Item 1                                                                                              </text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Item 2                                                                                              </text><text class="t" x="9" y="144" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">Item 3                                                                                              </text><text class="t" x="9" y="180" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="9" y="216" fill="rgb(205,213,235)" textLength="99" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Spacing = 0</text><text class="t" x="9" y="252" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">A                                                                                                   </text><text class="t" x="9" y="270" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">B                                                                                                   </text><text class="t" x="9" y="288" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">C                                                                                                   </text></svg>