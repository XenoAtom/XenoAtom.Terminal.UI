<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 342" width="918" height="342" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-feature-settings:"liga" 0,"calt" 0;letter-spacing:0}</style><rect x="0" y="0" width="918" height="342" fill="rgb(25,32,54)"/><text class="t" x="9" y="18" fill="rgb(205,213,235)" textLength="522" lengthAdjust="spacing" opacity="0.75" xml:space="preserve">Resize the terminal to see wrapping and trimming behavior.</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" textLength="9" lengthAdjust="spacing" font-weight="700" xml:space="preserve">☑</text><text class="t" x="18" y="54" fill="rgb(205,213,235)" textLength="891" lengthAdjust="spacing" xml:space="preserve">  Wrap                                                                                             </text><text class="t" x="9" y="90" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">This is a long TextBlock line that will reflow when wrapping is enabled and the terminal is resized.</text><text class="t" x="9" y="108" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">It also contains an emoji sequence: 🗃️  Download (watch spacing). Last line: The quick brown fox    </text><text class="t" x="9" y="126" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">jumps over the lazy dog.                                                                            </text><text class="t" x="9" y="162" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">TextBlockStyle examples:                                                                            </text><text class="t" x="9" y="198" fill="rgb(0,191,255)" textLength="153" lengthAdjust="spacing" font-weight="700" xml:space="preserve">Styled foreground</text><rect x="9" y="234" width="225" height="18" fill="rgb(101,102,109)"/><text class="t" x="9" y="234" fill="rgb(205,213,235)" textLength="225" lengthAdjust="spacing" xml:space="preserve">Filled background (alpha)</text><rect x="234" y="234" width="675" height="18" fill="rgb(76,78,88)"/><text class="t" x="9" y="270" fill="rgb(189,189,191)" textLength="900" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="9" y="306" fill="rgb(205,213,235)" textLength="900" lengthAdjust="spacing" xml:space="preserve">This is a single-line TextBlock that will be trimmed when the viewport is too small.                </text></svg>