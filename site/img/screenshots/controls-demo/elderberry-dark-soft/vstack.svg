<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" width="900" height="288" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="288" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">VStack stacks children vertically. Spacing controls the gap between items.</text><text class="t" x="0" y="54" fill="rgb(205,213,235)" xml:space="preserve">Item 1                                                                                              </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" xml:space="preserve">Item 2                                                                                              </text><text class="t" x="0" y="126" fill="rgb(205,213,235)" xml:space="preserve">Item 3                                                                                              </text><text class="t" x="0" y="162" fill="rgb(189,189,191)" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="0" y="198" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Spacing = 0</text><text class="t" x="0" y="234" fill="rgb(205,213,235)" xml:space="preserve">A                                                                                                   </text><text class="t" x="0" y="252" fill="rgb(205,213,235)" xml:space="preserve">B                                                                                                   </text><text class="t" x="0" y="270" fill="rgb(205,213,235)" xml:space="preserve">C                                                                                                   </text></svg>