<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" width="900" height="324" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="324" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">Resize the terminal to see wrapping and trimming behavior.</text><text class="t" x="0" y="54" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☑</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" xml:space="preserve">  Wrap                                                                                             </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" xml:space="preserve">This is a long TextBlock line that will reflow when wrapping is enabled and the terminal is resized.</text><text class="t" x="0" y="108" fill="rgb(205,213,235)" xml:space="preserve">It also contains an emoji sequence: 🗃️  Download (watch spacing). Last line: The quick brown fox    </text><text class="t" x="0" y="126" fill="rgb(205,213,235)" xml:space="preserve">jumps over the lazy dog.                                                                            </text><text class="t" x="0" y="162" fill="rgb(205,213,235)" xml:space="preserve">TextBlockStyle examples:                                                                            </text><text class="t" x="0" y="198" fill="rgb(0,191,255)" font-weight="700" xml:space="preserve">Styled foreground</text><rect x="0" y="234" width="225" height="18" fill="rgb(101,102,109)"/><text class="t" x="0" y="234" fill="rgb(205,213,235)" xml:space="preserve">Filled background (alpha)</text><rect x="225" y="234" width="675" height="18" fill="rgb(76,78,88)"/><text class="t" x="0" y="270" fill="rgb(189,189,191)" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="0" y="306" fill="rgb(205,213,235)" xml:space="preserve">This is a single-line TextBlock that will be trimmed when the viewport is too small.                </text></svg>