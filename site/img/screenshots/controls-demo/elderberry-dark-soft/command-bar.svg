<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="720" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">CommandBar surfaces commands registered on the focused visual (and its parents), plus app-level</text><text class="t" x="0" y="18" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">commands.</text><rect x="9" y="72" width="882" height="18" fill="rgb(23,29,49)"/><rect x="0" y="108" width="18" height="18" fill="rgb(74,76,86)"/><rect x="18" y="108" width="81" height="18" fill="rgb(74,76,86)"/><text class="t" x="18" y="108" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Increment</text><rect x="99" y="108" width="18" height="18" fill="rgb(74,76,86)"/><text class="t" x="135" y="108" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☑</text><text class="t" x="144" y="108" fill="rgb(205,213,235)" xml:space="preserve">  Enabled                                                                           </text><text class="t" x="0" y="144" fill="rgb(205,213,235)" xml:space="preserve">Counter: 0                                                                                          </text><text class="t" x="0" y="180" fill="rgb(189,189,191)" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><rect x="0" y="216" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="0" y="216" fill="rgb(94,122,229)" font-weight="700" xml:space="preserve">[Ctrl+Z]</text><rect x="72" y="216" width="9" height="18" fill="rgb(57,60,73)"/><rect x="81" y="216" width="36" height="18" fill="rgb(57,60,73)"/><text class="t" x="81" y="216" fill="rgb(155,161,179)" xml:space="preserve">Undo</text><rect x="117" y="216" width="27" height="18" fill="rgb(57,60,73)"/><text class="t" x="117" y="216" fill="rgb(205,213,235)" xml:space="preserve"> | </text><rect x="144" y="216" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="144" y="216" fill="rgb(94,122,229)" font-weight="700" xml:space="preserve">[Ctrl+R]</text><rect x="216" y="216" width="9" height="18" fill="rgb(57,60,73)"/><rect x="225" y="216" width="36" height="18" fill="rgb(57,60,73)"/><text class="t" x="225" y="216" fill="rgb(155,161,179)" xml:space="preserve">Redo</text><rect x="261" y="216" width="27" height="18" fill="rgb(57,60,73)"/><text class="t" x="261" y="216" fill="rgb(205,213,235)" xml:space="preserve"> | </text><rect x="288" y="216" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="288" y="216" fill="rgb(94,122,229)" font-weight="700" xml:space="preserve">[Ctrl+E]</text><rect x="360" y="216" width="162" height="18" fill="rgb(57,60,73)"/><text class="t" x="360" y="216" fill="rgb(205,213,235)" xml:space="preserve"> Toggle enabled | </text><rect x="522" y="216" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="522" y="216" fill="rgb(94,122,229)" font-weight="700" xml:space="preserve">[Ctrl+R]</text><rect x="594" y="216" width="9" height="18" fill="rgb(57,60,73)"/><rect x="603" y="216" width="117" height="18" fill="rgb(57,60,73)"/><text class="t" x="603" y="216" fill="rgb(155,161,179)" xml:space="preserve">Reset counter</text><rect x="720" y="216" width="27" height="18" fill="rgb(57,60,73)"/><text class="t" x="720" y="216" fill="rgb(205,213,235)" xml:space="preserve"> | </text><rect x="747" y="216" width="72" height="18" fill="rgb(57,60,73)"/><text class="t" x="747" y="216" fill="rgb(94,122,229)" font-weight="700" xml:space="preserve">[Ctrl+Q]</text><rect x="819" y="216" width="45" height="18" fill="rgb(57,60,73)"/><text class="t" x="819" y="216" fill="rgb(205,213,235)" xml:space="preserve"> Quit</text></svg>