<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="270" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">MenuBar</text><text class="t" x="0" y="36" fill="rgb(205,213,235)" xml:space="preserve">Use Tab to focus the menu bar, then Enter/Down to open. Use arrow keys to navigate and Enter to     </text><text class="t" x="0" y="54" fill="rgb(205,213,235)" xml:space="preserve">activate.                                                                                           </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☑</text><text class="t" x="9" y="90" fill="rgb(205,213,235)" xml:space="preserve">  Open enabled                                                                                     </text><rect x="0" y="126" width="900" height="18" fill="rgb(74,76,86)"/><text class="t" x="0" y="126" fill="rgb(205,213,235)" xml:space="preserve">   File    Help                                                                                     </text><text class="t" x="0" y="162" fill="rgb(205,213,235)" xml:space="preserve">Status: ready                                                                                       </text><rect x="9" y="198" width="612" height="18" fill="rgb(34,40,58)"/><text class="t" x="9" y="198" fill="rgb(205,213,235)" xml:space="preserve">This is a focusable control. Try focusing it, then opening the menu.</text><rect x="621" y="198" width="270" height="18" fill="rgb(30,36,56)"/><rect x="9" y="216" width="882" height="18" fill="rgb(30,36,56)"/><rect x="9" y="234" width="882" height="18" fill="rgb(30,36,56)"/><rect x="9" y="252" width="882"