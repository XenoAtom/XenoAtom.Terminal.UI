<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="432" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">Use Space/Enter to toggle an item. Use arrows to move.</text><text class="t" x="0" y="54" fill="rgb(189,189,191)" font-weight="700" xml:space="preserve">→☐  </text><text class="t" x="36" y="54" fill="rgb(189,189,191)" font-weight="700" xml:space="preserve">Alpha</text><text class="t" x="0" y="72" fill="rgb(205,213,235)" xml:space="preserve"> ☐  Beta                                                                                            </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" xml:space="preserve"> ☐  Gamma                                                                                           </text><text class="t" x="0" y="108" fill="rgb(205,213,235)" xml:space="preserve"> ☐  Delta                                                                                           </text><text class="t" x="0" y="126" fill="rgb(205,213,235)" xml:space="preserve"> ☐  Epsilon                                                                                         </text><text class="t" x="0" y="162" fill="rgb(205,213,235)" xml:space="preserve">Checked: 0                                                                                          </text><text class="t" x="0" y="198" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">With many items, wrap SelectionList in a ScrollViewer.</text><text class="t" x="0" y="252" fill="rgb(189,189,191)" xml:space="preserve">┌────────────┐</text><text class="t" x="0" y="270" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="9" y="270"