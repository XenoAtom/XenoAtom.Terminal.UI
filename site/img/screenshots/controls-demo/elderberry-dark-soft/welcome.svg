ill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Ctrl+Q</text><text class="t" x="108" y="162" fill="rgb(205,213,235)" xml:space="preserve"> to quit.                                                                               </text><text class="t" x="0" y="216" fill="rgb(189,189,191)" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="0" y="252" fill="rgb(189,189,191)" xml:space="preserve">┌</text><text class="t" x="18" y="252" fill="rgb(189,189,191)" font-weight="700" xml:space="preserve">Scheme: Elderberry Dark Soft</text><text class="t" x="279" y="252" fill="rgb(189,189,191)" xml:space="preserve">───────────┐</text><text class="t" x="0" y="270" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="378" y="270" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="0" y="288" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="18" y="288" fill="rgb(189,189,191)" xml:space="preserve">┌──────────────┬────────────┬─────────┐</text><text class="t" x="378" y="288" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="0" y="306" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="18" y="306" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="36" y="306" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Name</text><text class="t" x="153" y="306" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="171" y="306" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Sample</text><text class="t" x="270" y="306" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="288" y="306" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Value</text><text class="t" x="360" y="306" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="378" y="306" fill="rgb(189,189,191)" xml:spa