<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="468" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Context menus</text><text class="t" x="0" y="36" fill="rgb(205,213,235)" xml:space="preserve">Right-click to open a context menu. If ContextMenuFactory is not provided, the framework discovers  </text><text class="t" x="0" y="54" fill="rgb(205,213,235)" xml:space="preserve">commands with CommandPresentation.ContextMenu.                                                      </text><text class="t" x="0" y="90" fill="rgb(189,189,191)" xml:space="preserve">┌</text><text class="t" x="18" y="90" fill="rgb(189,189,191)" font-weight="700" xml:space="preserve">Command-based</text><text class="t" x="144" y="90" fill="rgb(189,189,191)" xml:space="preserve">───────────────────┐</text><text class="t" x="0" y="108" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="315" y="108" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="0" y="126" fill="rgb(189,189,191)" xml:space="preserve">│</text><rect x="27" y="126" width="270" height="18" fill="rgb(34,40,58)"/><text class="t" x="27" y="126" fill="rgb(205,213,235)" xml:space="preserve">Right-click in this editor to </text><text class="t" x="315" y="126" fill="rgb(189,189,191)" xml:space="preserve">│</text><text class="t" x="0" y="144" fill="rgb(189,189,191)" xml:space="preserve">│</text><rect x="27" y="144" width="180" height="18" fill="rgb(34,40,58)"/><text class="t" x="27" y="144" fill="rgb(205,213,235)" xml:space="preserve">open a context menu.</text><rect x="207" y="144" width="90" height="18" fill="rgb(30,36,56)"/><text class="t" x