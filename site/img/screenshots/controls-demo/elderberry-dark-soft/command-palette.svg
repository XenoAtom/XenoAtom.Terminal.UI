<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 162" width="900" height="162" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="162" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Command palette</text><text class="t" x="0" y="36" fill="rgb(205,213,235)" xml:space="preserve">Press Ctrl+P to open the command palette. Type to search, use arrows to select, and Enter to run.   </text><rect x="9" y="72" width="486" height="18" fill="rgb(34,40,58)"/><text class="t" x="9" y="72" fill="rgb(183,191,211)" xml:space="preserve">Enter some text here to enable CTRL+P to be accessible</text><rect x="495" y="72" width="396" height="18" fill="rgb(30,36,56)"/><rect x="0" y="108" width="18" height="18" fill="rgb(74,76,86)"/><rect x="18" y="108" width="81" height="18" fill="rgb(74,76,86)"/><text class="t" x="18" y="108" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Increment</text><rect x="99" y="108" width="18" height="18" fill="rgb(74,76,86)"/><text class="t" x="135" y="108" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☑</text><text class="t" x="144" y="108" fill="rgb(205,213,235)" xml:space="preserve">  Enabled                                                                           </text><text class="t" x="0" y="144" fill="rgb(205,213,235)" xml:space="preserve">Counter: 0                                                                                          </text></svg>