<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 144" width="900" height="144" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="144" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">Markup supports styling tags and hard line breaks.</text><text class="t" x="0" y="54" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☑</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" xml:space="preserve">  Wrap                                                                                             </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Bold</text><text class="t" x="36" y="90" fill="rgb(205,213,235)" xml:space="preserve">, </text><text class="t" x="54" y="90" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">dim</text><text class="t" x="81" y="90" fill="rgb(205,213,235)" xml:space="preserve">, </text><text class="t" x="99" y="90" fill="rgb(205,213,235)" text-decoration="underline" xml:space="preserve">underline</text><text class="t" x="0" y="108" fill="rgb(205,213,235)" xml:space="preserve">This is a long line that can be wrapped to demonstrate text wrapping in Markup.                     </text></svg>