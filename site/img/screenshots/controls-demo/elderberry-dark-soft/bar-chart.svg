<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="180" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">BarChart displays items as horizontal bars. Values are displayed near the end of each bar.</text><text class="t" x="0" y="54" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☑</text><text class="t" x="9" y="54" fill="rgb(205,213,235)" xml:space="preserve">  Show values  </text><text class="t" x="144" y="54" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">☐</text><text class="t" x="153" y="54" fill="rgb(205,213,235)" xml:space="preserve">  Show %                                                                           </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" xml:space="preserve">Distribution                                                                                        </text><text class="t" x="0" y="108" fill="rgb(205,213,235)" xml:space="preserve">Alpha </text><text class="t" x="54" y="108" fill="rgb(30,144,255)" font-weight="700" xml:space="preserve">███████████████████████████████████████████████████████████████████████████▎</text><text class="t" x="738" y="108" fill="rgb(30,144,255)" opacity="0.75" xml:space="preserve">8</text><text class="t" x="0" y="126" fill="rgb(205,213,235)" xml:space="preserve">Beta  </text><text class="t" x="54" y="126" fill="rgb(50,205,50)" font-weight="700" xml:space="preserve">███████████████████████████████████████████████</text><text class="t" x="477" y="126" fill="rgb(50,205,50)" opacity="0.75" xml:space="preserve">5</text><text class="t" x="0" y="144" fill="rgb(205,213,235)" xml:space="preserve">Gamma </text><text class="t" x="54" y="144" fill="rgb(255,165,0)" font-weight="700" xml:space="preserve">██████████████████▊</text><text class="t" x="225" y="144" fill="rgb(255,165,0)" opacity="0.75" xml:space="preserve">2</text><text class="t" x="0" y="162" fill="rgb(205,213,235)" xml:space="preserve">Delta </text><text class="t" x="54" y="162" fill="rgb(205,92,92)" font-weight="700" xml:space="preserve">█████████▍</text><text class="t" x="144" y="162" fill="rgb(205,92,92)" opacity="0.75" xml:space="preserve">1</text></svg>