<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 216" width="900" height="216" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="216" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">Popups are useful for dropdowns and context menus.</text><text class="t" x="0" y="54" fill="rgb(205,213,235)" xml:space="preserve">This is a line of text to give space                                                                </text><text class="t" x="0" y="90" fill="rgb(205,213,235)" xml:space="preserve">This is another line                                                                                </text><text class="t" x="0" y="126" fill="rgb(205,213,235)" xml:space="preserve">And another line                                                                                    </text><text class="t" x="0" y="162" fill="rgb(205,213,235)" xml:space="preserve">Now you can try it:                                                                                 </text><rect x="0" y="198" width="18" height="18" fill="rgb(74,76,86)"/><rect x="18" y="198" width="90" height="18" fill="rgb(74,76,86)"/><text class="t" x="18" y="198" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Show popup</text><rect x="108" y="198" width="18" height="18" fill="rgb(74,76,86)"/><rect x="135" y="198" width="18" height="18" fill="rgb(74,76,86)"/><rect x="153" y="198" width="135" height="18" fill="rgb(74,76,86)"/><text class="t" x="153" y="198" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Show long popup</text><rect x="288" y="198" width="18" height="18" fill="rgb(74,76,86)"/><text class="t" x="306" y="198" fill="rgb(205,213,235)" xml:space="preserve"> Placement:  Below </text><text class="t" x="477" y="198" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">▾</text></svg>