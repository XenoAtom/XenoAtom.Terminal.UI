<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" shape-rendering="crispEdges"><style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:18px;dominant-baseline:text-before-edge;white-space:pre}</style><rect x="0" y="0" width="900" height="180" fill="rgb(25,32,54)"/><text class="t" x="0" y="0" fill="rgb(205,213,235)" opacity="0.75" xml:space="preserve">HStack stacks children horizontally.</text><text class="t" x="0" y="54" fill="rgb(205,213,235)" xml:space="preserve">One  Two  Three                                                                                     </text><text class="t" x="0" y="90" fill="rgb(189,189,191)" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text class="t" x="0" y="126" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Mixed controls</text><rect x="0" y="162" width="18" height="18" fill="rgb(74,76,86)"/><rect x="18" y="162" width="36" height="18" fill="rgb(74,76,86)"/><text class="t" x="18" y="162" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Left</text><rect x="54" y="162" width="18" height="18" fill="rgb(74,76,86)"/><rect x="90" y="162" width="54" height="18" fill="rgb(34,40,58)"/><text class="t" x="90" y="162" fill="rgb(205,213,235)" xml:space="preserve">Middle</text><rect x="144" y="162" width="144" height="18" fill="rgb(30,36,56)"/><rect x="306" y="162" width="18" height="18" fill="rgb(74,76,86)"/><rect x="324" y="162" width="45" height="18" fill="rgb(74,76,86)"/><text class="t" x="324" y="162" fill="rgb(205,213,235)" font-weight="700" xml:space="preserve">Right</text><rect x="369" y="162" width="18" height="18" fill="rgb(74,76,86)"/></svg>